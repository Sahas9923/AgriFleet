server.port=${PORT:8082}

spring.datasource.url=jdbc:sqlite:${DB_PATH:../AgriFleet.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://agri-fleet-eight.vercel.app,https://agri-fleet-*.vercel.app,http://localhost:3000}

# Core service (vehicles, bookings) ? used by AllocationService
core.service.url=${CORE_SERVICE_URL:https://agrifleet-0kd0.onrender.com/api/v1}